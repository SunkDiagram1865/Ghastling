name: Ghastling release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ghastling-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run release guardrails
        run: |
          node scripts/ghastling/brand-guard.mjs
          node scripts/ghastling/i18n-check.mjs
          cargo fmt --all --check

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/ghastling-release-notes.md"
          node scripts/ghastling/create-release-notes.mjs "${GITHUB_REF_NAME}" "$release_notes"
          existing_release="$(
            gh release list --limit 100 --json tagName \
              --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .tagName"
          )"
          if [[ -n "$existing_release" ]]; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "Ghastling Launcher ${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}"

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            args: --config tauri-release.conf.json
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - uses: ./.github/actions/replace-gradle-mirror

      - name: Set release version
        run: node scripts/ghastling/set-version.mjs "${{ github.ref_name }}"

      - name: Build
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        with:
          projectPath: apps/app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          retryAttempts: 2

      - name: Package updater zip and sign
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # 1. 找到便携版 EXE
          EXE_SRC=$(find target/release -maxdepth 1 -name "Ghastling Launcher.exe" | head -1)
          if [[ -z "$EXE_SRC" ]]; then
            echo "Error: Could not find Ghastling Launcher.exe in target/release/"
            ls -la target/release/ || true
            exit 1
          fi

          # 2. 上传便携版 EXE（不带版本号）
          cp "$EXE_SRC" "Ghastling Launcher.exe"
          gh release upload "${GITHUB_REF_NAME}" "Ghastling Launcher.exe" --clobber

          # 3. 打包更新 zip（zip 内只有 Ghastling Launcher.exe）
          ZIP_NAME="Ghastling_${VERSION}_x64.zip"
          mkdir -p updater-stage
          cp "$EXE_SRC" "updater-stage/Ghastling Launcher.exe"
          cd updater-stage
          if command -v zip >/dev/null 2>&1; then
            zip -9 "../${ZIP_NAME}" "Ghastling Launcher.exe"
          else
            powershell -NoProfile -Command "Compress-Archive -Path 'Ghastling Launcher.exe' -DestinationPath '../${ZIP_NAME}' -Force"
          fi
          cd ..

          # 4. 写入私钥临时文件（base64 解码）
          KEY_TMP="$(mktemp /tmp/ghastling-sign-key.XXXXXX)"
          SIG_TMP="${KEY_TMP}.sig"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > "$KEY_TMP"

          # 5. 下载 minisign 并签名（签名密码通过环境变量）
          if ! command -v minisign >/dev/null 2>&1; then
            MINISIGN_VER="0.11"
            curl -fsSL -o /tmp/minisign.zip \
              "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VER}/minisign-${MINISIGN_VER}-win64.zip"
            unzip -jo /tmp/minisign.zip -d /tmp/minisign-bin
            export PATH="/tmp/minisign-bin:$PATH"
          fi

          SIG_NAME="${ZIP_NAME}.sig"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            | minisign -S -s "$KEY_TMP" -c "Ghastling ${VERSION} updater zip" \
                -m "${ZIP_NAME}" -x "${SIG_NAME}" 2>/dev/null \
            || minisign -S -s "$KEY_TMP" -W -c "Ghastling ${VERSION} updater zip" \
                -m "${ZIP_NAME}" -x "${SIG_NAME}"

          # 6. 上传 zip + sig
          gh release upload "${GITHUB_REF_NAME}" "${ZIP_NAME}" "${SIG_NAME}" --clobber

          # 7. 清理
          rm -f "$KEY_TMP" "$SIG_TMP"
          rm -rf updater-stage /tmp/minisign-bin /tmp/minisign.zip /tmp/ghastling-sign-key.*

  verify-and-publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern '*.sig' --dir release-check/signatures

      - name: Download release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id"
          )"
          if [[ -z "$release_id" ]]; then
            echo "Release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-check/release.json

      - name: Generate update manifest
        run: node scripts/ghastling/create-update-manifest.mjs release-check/release.json release-check/signatures "${GITHUB_REF_NAME}" release-check/latest.json

      - name: Verify update manifest
        run: node scripts/ghastling/verify-update-manifest.mjs release-check/latest.json "${GITHUB_REF_NAME}"

      - name: Upload update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-check/latest.json --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi
