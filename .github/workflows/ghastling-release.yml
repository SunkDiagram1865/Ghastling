name: Ghastling release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ghastling-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release guardrails
        run: |
          node scripts/ghastling/brand-guard.mjs
          node scripts/ghastling/i18n-check.mjs
          cargo fmt --all --check

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/ghastling-release-notes.md"
          node scripts/ghastling/create-release-notes.mjs "${GITHUB_REF_NAME}" "$release_notes"
          existing_release="$(
            gh release list --limit 100 --json tagName \
              --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .tagName"
          )"
          if [[ -n "$existing_release" ]]; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "Ghastling Launcher ${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}"

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            args: --config tauri-release.conf.json
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/replace-gradle-mirror

      - name: Set release version
        run: node scripts/ghastling/set-version.mjs "${{ github.ref_name }}"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config tauri-release.conf.json
        working-directory: apps/app

      - name: Build portable zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $appName = "Ghastling Launcher"
          $outDir = "target/release/bundle/portable"
          $buildDir = "target/portable-build/ziproot"

          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          # Reuse the binary already built
          $appExe = "target/release/${appName}.exe"
          if (Test-Path $appExe) {
            Copy-Item -Force $appExe "$buildDir\${appName}.exe"

            # Create portable zip using .NET ZipFile with Deflate compression
            $zipName = "Ghastling_${version}_x64.zip"
            $zipPath = Join-Path $outDir $zipName
            if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $compression = [System.IO.Compression.CompressionLevel]::Optimal
            [System.IO.Compression.ZipFile]::CreateFromDirectory($buildDir, $zipPath, $compression, $false)
            Write-Output "Created portable zip: $zipPath"

            # Sign the portable zip for Tauri auto-update
            $zipPath = Resolve-Path $zipPath

            cd apps/app
            pnpm tauri signer sign --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$zipPath"
            cd ../..

            $sigPath = "${zipPath}.sig"
            if (Test-Path $sigPath) {
              gh release upload "${{ github.ref_name }}" $zipPath --clobber
              gh release upload "${{ github.ref_name }}" $sigPath --clobber
              Write-Output "Uploaded portable zip $zipName and signature"
            } else {
              Write-Error "Signature file not generated for $zipName"
              exit 1
            }
          } else {
            Write-Error "Binary not found at $appExe"
            exit 1
          }

  verify-and-publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern '*.sig' --dir release-check/signatures

      - name: Download release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id"
          )"
          if [[ -z "$release_id" ]]; then
            echo "Release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-check/release.json

      - name: Generate update manifest
        run: node scripts/ghastling/create-update-manifest.mjs release-check/release.json release-check/signatures "${GITHUB_REF_NAME}" release-check/latest.json

      - name: Verify update manifest
        run: node scripts/ghastling/verify-update-manifest.mjs release-check/latest.json "${GITHUB_REF_NAME}"

      - name: Upload update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-check/latest.json --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi
