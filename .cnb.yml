main:
  'crontab: */15 * * * *':
    - name: Sync source from GitHub
      stages:
        - name: Mirror GitHub repository
          script: |
            set -eu
            mirror_dir="$(mktemp -d)"
            trap 'rm -rf "$mirror_dir"' EXIT
            git clone --mirror https://github.com/Mystic-Stars/Axolotl.git "$mirror_dir/repository.git"
            git -C "$mirror_dir/repository.git" remote add cnb "${CNB_REPO_URL_HTTPS:-https://cnb.cool/axlmc/Axolotl.git}"
            printf '%s:%s' "${CNB_TOKEN_USER_NAME:-cnb}" "$CNB_TOKEN" > "$mirror_dir/auth"
            auth="$(base64 "$mirror_dir/auth")"
            git_cnb() {
              git -C "$mirror_dir/repository.git" -c "http.extraHeader=Authorization: Basic $auth" "$@"
            }
            git_cnb push --force cnb refs/heads/main:refs/heads/main
            git_cnb fetch cnb '+refs/tags/v*:refs/cnb/tags/v*'
            git -C "$mirror_dir/repository.git" for-each-ref --format='%(refname:strip=2)' 'refs/tags/v*' > "$mirror_dir/github-tags"
            while IFS= read -r tag; do
              if ! git -C "$mirror_dir/repository.git" show-ref --verify --quiet "refs/cnb/tags/$tag"; then
                git_cnb push cnb "refs/tags/$tag:refs/tags/$tag"
              elif [ "$(git -C "$mirror_dir/repository.git" rev-parse "refs/tags/$tag")" != "$(git -C "$mirror_dir/repository.git" rev-parse "refs/cnb/tags/$tag")" ]; then
                echo "CNB tag $tag differs from GitHub; leaving the existing release tag unchanged"
              fi
            done < "$mirror_dir/github-tags"

'v*':
  tag_push:
    - name: Mirror GitHub release
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: node:24-bookworm
      stages:
        - name: Wait for and publish GitHub release
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends git
            node scripts/axolotl/cnb-release.mjs finalize "$CNB_BRANCH" cnb-release/final
            node scripts/axolotl/verify-update-manifest.mjs cnb-release/final/latest.json "$CNB_BRANCH" cnb

'mirror-v*':
  tag_push:
    - name: Mirror existing GitHub release
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: node:24-bookworm
      stages:
        - name: Mirror requested GitHub release
          script: |
            set -eu
            release_tag="${CNB_BRANCH#mirror-}"
            apt-get update
            apt-get install -y --no-install-recommends git
            node scripts/axolotl/cnb-release.mjs finalize "$release_tag" cnb-release/final
            node scripts/axolotl/verify-update-manifest.mjs cnb-release/final/latest.json "$release_tag" cnb
